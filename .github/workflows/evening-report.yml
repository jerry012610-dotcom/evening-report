name: 晚報
 
on:
  schedule:
    - cron: "30 9 * * 1-5"    # 台北 17:30
    - cron: "30 11 * * 1-5"   # 台北 19:30（保險場）
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - run: pip install requests
 
      - name: 抓資料並產報告
        run: python run.py
 
      - name: 存回 repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reports LATEST.md
          if git diff --staged --quiet; then
            echo "無變更（可能為非交易日）"
          else
            git commit -m "晚報 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            git push
          fi
 
      - name: 顯示報告
        if: always()
        run: |
          if [ -f LATEST.md ]; then cat LATEST.md >> $GITHUB_STEP_SUMMARY; fi
